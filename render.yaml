services:
  - type: web
    name: agente-de-projetos
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ADMIN_RESET_TOKEN
        generateValue: true
    disk:
      name: agente-de-projetos-data
      mountPath: /data
      sizeGB: 1
